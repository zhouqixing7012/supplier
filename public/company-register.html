<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业供应商代注册</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-width:1200px;height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#536178;background:#fff;font-size:14px}.page{width:100%;min-height:865px;background:#fff;overflow:hidden}.crumb{height:49px;border-bottom:1px solid #ececec;display:flex;align-items:center;padding-left:5px;gap:3px;color:#3e4c60}.crumb:before{content:"";display:block;width:7px;height:18px;border-radius:4px;background:#409eff;margin-right:5px}.crumb a{color:#409eff;text-decoration:none}.main{position:relative;height:816px;background:#fff}.steps{position:absolute;left:207px;top:24px;width:625px;height:90px;display:flex}.step{position:relative;width:200px;color:#c5cbd4}.step:last-child{width:110px}.step-top{height:26px;display:flex;align-items:center}.step-num{position:relative;z-index:2;width:23px;height:23px;border:2px solid #c5cbd4;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}.step-line{width:177px;height:2px;background:#c5cbd4}.step-title{font-size:16px;margin-top:8px;color:#c5cbd4}.step-desc{font-size:12px;margin-top:5px;white-space:nowrap;color:#c5cbd4}.step.active .step-num{border-color:#161616;color:#161616}.step.active .step-title{color:#161616;font-weight:700}.step.active .step-desc{color:#444}.top-row{position:absolute;left:0;right:0;top:135px;height:78px}.field{position:absolute;height:31px;display:flex;align-items:center}.label{width:176px;text-align:right;padding-right:14px;white-space:nowrap;color:#536178}.label.required:before{content:"*";color:#f04438;margin-right:4px}.input,.select{height:31px;border:1px solid #c7d5ec;border-radius:4px;background:#fff;color:#536178;padding:0 11px;outline:none;font-size:14px}.input::placeholder{color:#c3c9d2}.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#c0c8d3 50%),linear-gradient(135deg,#c0c8d3 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:28px}.supplier-type{left:83px;top:0}.supplier-type .label{width:114px}.supplier-type .select{width:537px}.license{left:803px;top:0;height:42px}.license .label{width:155px}.help{display:inline-flex;width:15px;height:15px;border:1px solid #647083;border-radius:50%;align-items:center;justify-content:center;font-size:11px;margin-left:3px;color:#647083;vertical-align:middle}.upload{width:62px;height:42px;border:1px dashed #b8c9df;border-radius:6px;background:#fff;position:relative}.upload:before,.upload:after{content:"";position:absolute;background:#7d8b9d;left:50%;top:50%;transform:translate(-50%,-50%)}.upload:before{width:25px;height:1px}.upload:after{width:1px;height:25px}.license-note{margin-left:120px;color:#ff2020;white-space:nowrap}.divider{position:absolute;left:0;right:0;top:213px;height:1px;background:#dfdfdf}.form-area{position:absolute;left:0;right:0;top:262px;height:540px}.row{position:absolute;left:0;right:0;height:31px}.left-field,.right-field{position:absolute;display:flex;align-items:center;height:31px}.left-field{left:83px;width:651px}.right-field{left:803px;width:691px}.left-field .label{width:114px}.right-field .label{width:155px}.left-field .input,.left-field .select{width:537px}.right-field .input,.right-field .select{width:536px}.date-wrap{position:relative;width:537px}.date-wrap.right{width:536px}.date-wrap:before{content:"▦";position:absolute;left:10px;top:6px;color:#c5cfdd;font-size:14px;z-index:2}.date-wrap .input{padding-left:30px}.address{display:flex;width:536px;gap:5px}.address .select{width:321px}.address-detail{position:relative;width:210px}.address-detail .input{width:210px;padding-right:45px}.count{position:absolute;right:8px;top:7px;font-size:12px;color:#536178}.r1{top:0}.r2{top:50px}.r3{top:100px}.r4{top:150px}.r5{top:200px}.r6{top:250px}.r7{top:300px}.r8{top:350px}.full{position:absolute;left:83px;right:7px;top:400px;height:93px;display:flex}.full .label{width:114px;padding-top:9px;align-self:flex-start}.textarea-wrap{position:relative;flex:1;height:93px}.textarea{width:100%;height:93px;border:1px solid #c7d5ec;border-radius:4px;resize:none;padding:8px 12px 24px;color:#536178;font-family:inherit;font-size:14px;outline:none}.textarea::placeholder{color:#c3c9d2}.textarea-count{position:absolute;right:8px;bottom:6px;font-size:12px;color:#536178}.buttons{position:absolute;left:0;right:0;top:559px;height:35px;display:flex;justify-content:center;gap:30px}.btn{height:34px;min-width:60px;padding:0 15px;border:1px solid #c2d0e6;border-radius:3px;background:#fff;color:#536178;font-family:inherit;font-size:14px}.btn:hover{border-color:#7aaeff;color:#287eea}.muted-select{color:#c3c9d2}
    @media(max-width:1300px){.page{min-width:1200px}.left-field{left:50px}.supplier-type{left:50px}.full{left:50px}.right-field{left:720px}.license{left:720px}}
  </style>
</head>
<body>
  <div class="page">
    <div class="crumb"><a href="#">供应商管理首页</a><span>›</span><span>代注册</span></div>
    <div class="main">
      <div class="steps">
        <div class="step active"><div class="step-top"><span class="step-num">1</span><span class="step-line"></span></div><div class="step-title">基本信息</div><div class="step-desc">营业执照、证书、合作内容等</div></div>
        <div class="step"><div class="step-top"><span class="step-num">2</span><span class="step-line"></span></div><div class="step-title">联系人信息</div><div class="step-desc">供应商联系人电话及邮箱等</div></div>
        <div class="step"><div class="step-top"><span class="step-num">3</span><span class="step-line"></span></div><div class="step-title">银行信息</div><div class="step-desc">银行账号、开户证明等</div></div>
        <div class="step"><div class="step-top"><span class="step-num">4</span></div><div class="step-title">预览提交</div></div>
      </div>

      <div class="top-row">
        <div class="field supplier-type"><div class="label required">供应商类型：</div><select class="select"><option>企业供应商</option></select></div>
        <div class="field license"><div class="label required">营业执照：<span class="help">?</span></div><button class="upload" aria-label="上传营业执照"></button><span class="license-note">请先上传营业执照，企业信息可自动填充</span></div>
      </div>
      <div class="divider"></div>

      <div class="form-area">
        <div class="row r1"><div class="left-field"><div class="label required">供应商名称：</div><input class="input" placeholder="请输入供应商名称"></div><div class="right-field"><div class="label required">统一社会信用代码：</div><input class="input" placeholder="请输入统一社会信用代码"></div></div>
        <div class="row r2"><div class="left-field"><div class="label required">成立日期：</div><div class="date-wrap"><input class="input" placeholder="请选择成立日期"></div></div><div class="right-field"><div class="label required">证件有效期至：<span class="help">?</span></div><div class="date-wrap right"><input class="input" placeholder="请选择证件有效期至"></div></div></div>
        <div class="row r3"><div class="left-field"><div class="label required">法人代表：</div><input class="input" placeholder="请输入法人代表"></div><div class="right-field"><div class="label">公司电话：</div><input class="input" placeholder="请输入公司电话"></div></div>
        <div class="row r4"><div class="left-field"><div class="label required">企业类型：</div><select class="select muted-select"><option>请选择企业类型</option></select></div><div class="right-field"><div class="label required">所属行业：</div><select class="select muted-select"><option>请选择所属行业</option></select></div></div>
        <div class="row r5"><div class="left-field"><div class="label required">注册资金：<span class="help">?</span></div><input class="input" placeholder="请输入注册资金"></div><div class="right-field"><div class="label required">注册币种：</div><select class="select muted-select"><option>请选择注册币种</option></select></div></div>
        <div class="row r6"><div class="left-field"><div class="label required">国家：</div><select class="select"><option>国内</option></select></div><div class="right-field"><div class="label required">注册地址：</div><div class="address"><select class="select muted-select"><option>请选择</option></select><div class="address-detail"><input class="input" placeholder="请输入详细地址" maxlength="50"><span class="count">0/50</span></div></div></div></div>
        <div class="row r7"><div class="left-field"><div class="label">接收发票地址：</div><input class="input" placeholder="请输入接收发票地址"></div><div class="right-field"><div class="label">公司网址：</div><input class="input" placeholder="请输入公司网址"></div></div>
        <div class="row r8"><div class="left-field"><div class="label">纳税人资格：</div><select class="select muted-select"><option>请选择纳税人资格</option></select></div></div>
        <div class="full"><div class="label required">经营范围：</div><div class="textarea-wrap"><textarea class="textarea" placeholder="请输入经营范围" maxlength="4000"></textarea><span class="textarea-count">0/4000</span></div></div>
        <div class="buttons"><button class="btn">返回</button><button class="btn">下一步</button></div>
      </div>
    </div>
  </div>
</body>
</html>
