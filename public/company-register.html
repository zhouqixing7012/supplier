<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业供应商代注册</title><link rel="stylesheet" href="register-static.css"></head><body>
<nav class="topnav"><span class="title">代注册原型</span><a class="active" href="company-register.html">企业供应商</a><a href="personal-register.html">个人供应商</a><a href="government-register.html">政府机构或社团</a><a href="foreign-register.html">国外供应商</a></nav>
<div class="page company"><div class="crumb"><a href="#">供应商管理首页</a><span>›</span><span>代注册</span></div><div class="main">
<div class="steps"><div class="step active"><div class="step-top"><span class="step-num">1</span><span class="step-line"></span></div><div class="step-title">基本信息</div><div class="step-desc">营业执照、证书、合作内容等</div></div><div class="step"><div class="step-top"><span class="step-num">2</span><span class="step-line"></span></div><div class="step-title">联系人信息</div><div class="step-desc">供应商联系人电话及邮箱等</div></div><div class="step"><div class="step-top"><span class="step-num">3</span><span class="step-line"></span></div><div class="step-title">银行信息</div><div class="step-desc">银行账号、开户证明等</div></div><div class="step"><div class="step-top"><span class="step-num">4</span></div><div class="step-title">预览提交</div></div></div>
<div class="field supplier-type"><div class="label required">供应商类型：</div><select class="select"><option>企业供应商</option></select></div>
<div class="field license"><div class="label required">营业执照：<span class="help">?</span></div><button class="upload"></button><span class="license-note">请先上传营业执照，企业信息可自动填充</span></div><div class="divider"></div>
<div class="form-area">
<div class="row r1"><div class="left-field"><div class="label required">供应商名称：</div><input class="input" placeholder="请输入供应商名称"></div><div class="right-field reg-email-field"><div class="label required">供应商注册邮箱：<span class="help tip" data-tip="用于供应商登录协同门户及修改密码时接收验证码，请填写真实有效且可正常接收邮件的邮箱。">?</span></div><input class="input" type="email" required placeholder="请输入供应商注册邮箱"></div></div>
<div class="row r2"><div class="left-field"><div class="label required">统一社会信用代码：</div><input class="input" placeholder="请输入统一社会信用代码"></div><div class="right-field"><div class="label required">成立日期：</div><div class="date-wrap right"><input class="input" placeholder="请选择成立日期"></div></div></div>
<div class="row r3"><div class="left-field"><div class="label required">证件有效期至：<span class="help">?</span></div><div class="date-wrap"><input class="input" placeholder="请选择证件有效期至"></div></div><div class="right-field"><div class="label required">法人代表：</div><input class="input" placeholder="请输入法人代表"></div></div>
<div class="row r4"><div class="left-field"><div class="label">公司电话：</div><input class="input" placeholder="请输入公司电话"></div><div class="right-field"><div class="label required">企业类型：</div><select class="select muted-select"><option>请选择企业类型</option></select></div></div>
<div class="row r5"><div class="left-field"><div class="label required">所属行业：</div><select class="select muted-select"><option>请选择所属行业</option></select></div><div class="right-field"><div class="label required">注册资金：<span class="help">?</span></div><input class="input" placeholder="请输入注册资金"></div></div>
<div class="row r6"><div class="left-field"><div class="label required">注册币种：</div><select class="select muted-select"><option>请选择注册币种</option></select></div><div class="right-field"><div class="label required">国家：</div><select class="select"><option>国内</option></select></div></div>
<div class="row r7"><div class="left-field"><div class="label required">注册地址：</div><div class="address"><select class="select muted-select"><option>请选择</option></select><div class="address-detail"><input class="input" placeholder="请输入详细地址"><span class="count">0/50</span></div></div></div><div class="right-field"><div class="label">接收发票地址：</div><input class="input" placeholder="请输入接收发票地址"></div></div>
<div class="row r8"><div class="left-field"><div class="label">公司网址：</div><input class="input" placeholder="请输入公司网址"></div><div class="right-field"><div class="label">纳税人资格：</div><select class="select muted-select"><option>请选择纳税人资格</option></select></div></div>
<div class="full"><div class="label required">经营范围：</div><div class="textarea-wrap"><textarea class="textarea" placeholder="请输入经营范围"></textarea><span class="textarea-count">0/4000</span></div></div><div class="buttons"><button class="btn">返回</button><button class="btn">下一步</button></div>
</div></div></div></body></html>
