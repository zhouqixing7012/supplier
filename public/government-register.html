<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政府机构或社团代注册</title><link rel="stylesheet" href="register-static.css"></head><body>
<nav class="topnav"><span class="title">代注册原型</span><a href="company-register.html">企业供应商</a><a href="personal-register.html">个人供应商</a><a class="active" href="government-register.html">政府机构或社团</a><a href="foreign-register.html">国外供应商</a></nav>
<div class="page government"><div class="crumb"><a href="#">供应商管理首页</a><span>›</span><span>代注册</span></div><div class="main">
<div class="steps"><div class="step active"><div class="step-top"><span class="step-num">1</span><span class="step-line"></span></div><div class="step-title">基本信息</div><div class="step-desc">营业执照、证书、合作内容等</div></div><div class="step"><div class="step-top"><span class="step-num">2</span><span class="step-line"></span></div><div class="step-title">联系人信息</div><div class="step-desc">供应商联系人电话及邮箱等</div></div><div class="step"><div class="step-top"><span class="step-num">3</span><span class="step-line"></span></div><div class="step-title">银行信息</div><div class="step-desc">银行账号、开户证明等</div></div><div class="step"><div class="step-top"><span class="step-num">4</span></div><div class="step-title">预览提交</div></div></div>
<div class="field supplier-type"><div class="label required">供应商类型：</div><select class="select"><option>政府机构或社团</option></select></div>
<div class="form-area">
<div class="row r1"><div class="left-field"><div class="label required">供应商名称：</div><input class="input" placeholder="请输入供应商名称"></div></div>
<div class="row email-row"><div class="left-field"><div class="label required">供应商注册邮箱：<span class="help tip" data-tip="用于供应商登录协同门户及修改密码时接收验证码，请填写真实有效且可正常接收邮件的邮箱。">?</span></div><input class="input" type="email" required placeholder="请输入供应商注册邮箱"></div></div>
<div class="row r2"><div class="left-field"><div class="label required">国家：</div><select class="select"><option>国内</option></select></div><div class="right-field"><div class="label required">注册地址：</div><div class="address"><select class="select muted-select"><option>请选择</option></select><div class="address-detail"><input class="input" placeholder="请输入详细地址"><span class="count">0/50</span></div></div></div></div>
<div class="full coop"><div class="label required">与搜狐合作事项：</div><div class="textarea-wrap"><textarea class="textarea" placeholder="不能为空与搜狐合作事项"></textarea><span class="textarea-count">0/500</span></div></div>
<div class="full remark"><div class="label">备注：</div><div class="textarea-wrap"><textarea class="textarea" placeholder="请输入备注"></textarea></div></div>
<div class="buttons"><button class="btn">返回</button><button class="btn">下一步</button></div>
</div></div></div></body></html>
