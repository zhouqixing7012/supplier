name: Install Impeccable

on:
  push:
    paths:
      - '.impeccable-install-trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Impeccable project skill
        run: npx --yes impeccable@latest install --providers=github --scope=project --no-hooks

      - name: Commit generated skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Install Impeccable project skill"
            git push
          fi
