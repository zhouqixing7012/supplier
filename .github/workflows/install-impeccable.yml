name: Update Impeccable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Impeccable project skill
        run: npx --yes impeccable@latest update --providers=github --scope=project --no-hooks

      - name: Commit generated skill updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Impeccable is already up to date"
          else
            git commit -m "Update Impeccable project skill"
            git push
          fi
